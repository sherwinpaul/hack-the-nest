[project]
name = "hack-the-nest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "openai>=3.51.0",
    "openai-agents>=0.24.0",
    "pip>=26.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
